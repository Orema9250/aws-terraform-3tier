name: 'Terraform'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
   

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: "arn:aws:iam::556173312932:role/githubterraformrolec68d2e0fcf6ada69a6b12579b3"
        aws-region: "us-east-1"

    - name: Verify AWS identity
      run: aws sts get-caller-identity
    
    - name: Terraform Init
      run: terraform init

    - name: Terraform Format
      run: terraform fmt -check

    - name: Terraform Plan
      run: terraform plan -input=false

  
   