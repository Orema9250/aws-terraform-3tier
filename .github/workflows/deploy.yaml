name: Deploy 

on:
  workflow_run:
    workflows: [Build and Push to Amazon ECS]
    types: [completed]
    branches: ["main"]

concurrency:
  group: terraform-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1                  
  ECR_REPOSITORY: backend
  TF_WORKING_DIR: .

jobs:
  deploy-success:
    name: Deploy Backend to ASG success
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - run: echo 'The triggering workflow passed'
  
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
         role-to-assume: arn:aws:iam::556173312932:role/githubterraformrolec68d2e0fcf6ada69a6b12579b3
         aws-region:  us-east-1

    
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Get image tag
        id: image
        run: |
          IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "Deploying image:"
          echo "$IMAGE_TAG"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7
      
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init --reconfigure


      - name: Select Terraform workspace
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform workspace select dev || terraform workspace new dev

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
          -var="ecr_image_tag=$IMAGE_TAG" \
          

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve 
   
      - name: Verify Applicaton
        run: |
          echo "Waiting for ap to become healthy"
          for i in {1..20} ; do
            STATUS = $(curl  --fail --silent https://api.orema-devops.xyz/health || true)
            )
            echo "Http Status: $STATUS"  
          
           
            if [ "$STATUS" = '{"status":"healthy"}' ]; then
            echo "Application is healthy!"
            exit 0
            fi


            echo " Application not ready .Attempt $i/20 failed ..."
            sleep 15
          done
          echo "Application Health Verification Failed"
          exit 1
